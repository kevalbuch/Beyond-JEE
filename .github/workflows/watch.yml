name: Watch official exam pages

on:
  schedule:
    # Every 6 hours, offset off the hour so it doesn't pile up with everyone
    # else's :00 cron jobs.
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watch-exam-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check official pages for changes
        run: python3 scripts/watch/check.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "beyond-jee-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/notifications.json data/watch-snapshots
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Watch: update exam notification data"
            git pull --rebase origin main
            git push
          fi
